<!DOCTYPE html>
<html>

<head>
    <title>Display Products</title>
</head>

<body>

<h1 style="color: #6d4c41;">Furniture Shop</h1>

<h2 style="color: #6d4c41;">Display Products</h2>

<a href="/add">Add Product</a> |
<a href="/display">Display</a> |
<a href="/update">Update</a> |
<a href="/delete">Delete</a>

<hr>

<table border="1">

    <tr>
        <th>Order ID</th>
        <th>Customer Name</th>
        <th>Product Name</th>
        <th>Quantity</th>
        <th>Address</th>
    </tr>

    {% for f in furniture %}
    <tr>
        <td>{{ f[0] }}</td>
        <td>{{ f[1] }}</td>
        <td>{{ f[2] }}</td>
        <td>{{ f[3] }}</td>
        <td>{{ f[4] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
